name: Onboarding XML smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onboarding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean runtime, workspace, first document, retry and failure checks
        run: python -B -X utf8 -m unittest discover -s tests -v
